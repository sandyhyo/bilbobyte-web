<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BilboByte</title>

    <!-- =====================================================
         HOJAS DE ESTILO
         base.css: estilos generales de la web
         cube.css: navegación y animaciones del cubo
         ===================================================== -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cube.css">
</head>

<body>
    
<!-- =====================================================
     NAVEGACIÓN PRINCIPAL 3D
     El cubo representa las tres áreas principales.

     Cada área ocupa dos caras opuestas del cubo para que
     HOME, SOLUCIONES y CONTACTO permanezcan accesibles
     durante las distintas orientaciones del objeto.
     ===================================================== -->
<nav class="cube-navigation" aria-label="Navegación principal">

    <div class="cube-scene">

        <div class="navigation-cube" id="navigationCube">

            <!-- Cara frontal: HOME -->
            <button
                class="cube-face cube-face--front"
                type="button"
                data-section="home">
                HOME
            </button>

            <!-- Cara derecha: SOLUCIONES -->
            <button
                class="cube-face cube-face--right"
                type="button"
                data-section="solutions">
                SOLUCIONES
            </button>

            <!-- Cara superior: CONTACTO -->
            <button
                class="cube-face cube-face--top"
                type="button"
                data-section="contact">
                CONTACTO
            </button>

          <!-- Cara izquierda: SOLUCIONES -->
<button
    class="cube-face cube-face--left"
    type="button"
    data-section="solutions">
    SOLUCIONES
</button>

<!-- Cara trasera: HOME -->
<button
    class="cube-face cube-face--back"
    type="button"
    data-section="home">
    HOME
</button>

<!-- Cara inferior: CONTACTO -->
<button
    class="cube-face cube-face--bottom"
    type="button"
    data-section="contact">
    CONTACTO
</button> 

        </div>

    </div>

    <!-- =====================================================
         SELECTOR DE ÁREA
         Permite acceder siempre a cualquiera de las tres
         secciones, independientemente de qué caras del cubo
         estén visibles en ese momento.
         ===================================================== -->

    <div class="section-selector">

        <button
            type="button"
            class="section-selector__button active"
            data-section="home">
            HOME
        </button>

        <button
            type="button"
            class="section-selector__button"
            data-section="solutions">
            SOLUCIONES
        </button>

        <button
            type="button"
            class="section-selector__button"
            data-section="contact">
            CONTACTO
        </button>

    </div>

</nav>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
         De momento solo mostramos una sección cada vez.
         ===================================================== -->
    <main class="site-content">

        <section id="home" class="page-section active">
            <h1>BILBOBYTE</h1>
            <p>Infraestructura invisible para que tu negocio avance.</p>
        </section>

        <section id="solutions" class="page-section">
            <h1>SOLUCIONES</h1>
            <p>CONNECT · CORE · VAULT · SUITE · PRINT</p>
        </section>

        <section id="contact" class="page-section">
            <h1>CONTACTO</h1>
            <p>¿Hablamos?</p>
        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         cube.js controlará posteriormente la navegación 3D.
         ===================================================== -->
    <script src="js/cube.js"></script>

</body>

</html>
